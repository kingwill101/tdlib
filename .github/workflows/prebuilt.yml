name: Prebuilt

on:
  push:
    branches:
      - main
    tags:
      - 'tdlib-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to stamp into the generated manifest
        required: false
        type: string

permissions:
  contents: read

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  CONFIG: native_prebuilt.yaml
  MANIFEST_OUTPUT: lib/src/hook/tdlib_prebuilts.g.dart

  # Enable sccache's GitHub Actions storage backend.
  SCCACHE_GHA_ENABLED: "true"

  # Change this value whenever you intentionally want to clear all
  # previously cached C/C++ compilation results.
  SCCACHE_GHA_VERSION: "tdlib-v1"

  # CMake reads these when configuring a new build directory.
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            gperf \
            libclang-dev \
            ninja-build \
            pkg-config

      - name: Configure C/C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify native build tools
        run: |
          cmake --version
          ninja --version
          gperf --version
          "${SCCACHE_PATH}" --version

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Build and test
        run: dart test

      - name: Show compiler cache statistics
        if: always()
        run: "${SCCACHE_PATH} --show-stats"

      - name: Stage built library
        run: |
          rm -rf built-library
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-built-library
          path: built-library/
          if-no-files-found: error

  build-macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native tools
        run: brew install gperf

      - name: Configure C/C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify native build tools
        run: |
          cmake --version
          ninja --version
          gperf --version
          "${SCCACHE_PATH}" --version

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Build and test
        run: dart test

      - name: Show compiler cache statistics
        if: always()
        run: "${SCCACHE_PATH} --show-stats"

      - name: Stage built library
        run: |
          rm -rf built-library
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-built-library
          path: built-library/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Configure MSVC command-line environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install native tools
        shell: pwsh
        run: choco install gperf -y

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      # vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: '2024.11.16'

      - name: Export VCPKG_ROOT
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # sccache
      - name: Configure C/C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify native build tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          gperf --version
          cl
          & $env:SCCACHE_PATH --version
          echo "VCPKG_ROOT = $env:VCPKG_ROOT"

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Build and test
        run: dart test

      - name: Show compiler cache statistics
        if: always()
        shell: pwsh
        run: '& $env:SCCACHE_PATH --show-stats'

      - name: Stage built library
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force built-library -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path built-library | Out-Null
          Copy-Item -Recurse -Force ".dart_tool/lib/*" built-library

      - uses: actions/upload-artifact@v4
        with:
          name: windows-built-library
          path: built-library/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            gperf \
            libclang-dev \
            ninja-build \
            pkg-config

      - name: Configure C/C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify native build tools
        run: |
          cmake --version
          ninja --version
          gperf --version
          "${SCCACHE_PATH}" --version

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Build and test
        run: dart test

      - name: Show compiler cache statistics
        if: always()
        run: "${SCCACHE_PATH} --show-stats"

      - name: Stage built library
        run: |
          rm -rf built-library
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/

      - uses: actions/upload-artifact@v4
        with:
          name: android-built-library
          path: built-library/
          if-no-files-found: error

  build-ios:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native tools
        run: brew install gperf

      - name: Configure C/C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify native build tools
        run: |
          cmake --version
          ninja --version
          gperf --version
          "${SCCACHE_PATH}" --version

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Build and test
        run: dart test

      - name: Show compiler cache statistics
        if: always()
        run: "${SCCACHE_PATH} --show-stats"

      - name: Stage built library
        run: |
          rm -rf built-library
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-built-library
          path: built-library/
          if-no-files-found: error

  update-manifest:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-android
      - build-ios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/download-artifact@v4
        with:
          name: linux-built-library
          path: downloaded/linux/

      - uses: actions/download-artifact@v4
        with:
          name: macos-built-library
          path: downloaded/macos/

      - uses: actions/download-artifact@v4
        with:
          name: windows-built-library
          path: downloaded/windows/

      - uses: actions/download-artifact@v4
        with:
          name: android-built-library
          path: downloaded/android/

      - uses: actions/download-artifact@v4
        with:
          name: ios-built-library
          path: downloaded/ios/

      - name: Merge built libraries
        run: |
          rm -rf built-library release-assets
          mkdir -p built-library release-assets

          cp -R downloaded/linux/. built-library/
          cp -R downloaded/macos/. built-library/
          cp -R downloaded/windows/. built-library/
          cp -R downloaded/android/. built-library/
          cp -R downloaded/ios/. built-library/

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Generate manifest and release assets
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"

          dart run native_prebuilt manifest update \
            --config "$CONFIG" \
            --output "$MANIFEST_OUTPUT" \
            --built-library-dir built-library \
            --release-assets-dir release-assets \
            --tag "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    needs:
      - update-manifest
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: release-assets/*
