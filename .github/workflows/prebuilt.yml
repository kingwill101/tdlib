name: Prebuilt

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. tdlib-v1.8.64)
        required: true
        type: string
  pull_request:

permissions:
  contents: read

env:
  CONFIG: native_prebuilt.yaml
  MANIFEST_OUTPUT: native_prebuilt.lock.yaml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            artifact_name: linux-built-library
          - runner: macos-15
            target: macos-arm64
            artifact_name: macos-built-library
          - runner: windows-latest
            target: windows-x64
            artifact_name: windows-built-library
          - runner: ubuntu-latest
            target: android-arm64
            artifact_name: android-built-library-arm64
          - runner: ubuntu-latest
            target: android-arm
            artifact_name: android-built-library-arm
          - runner: ubuntu-latest
            target: android-x64
            artifact_name: android-built-library-x64
          - runner: ubuntu-latest
            target: android-ia32
            artifact_name: android-built-library-ia32
          - runner: macos-15
            target: ios-arm64
            artifact_name: ios-built-library
    uses: ./.github/workflows/native-prebuilt-build.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      artifact-name: ${{ matrix.artifact_name }}

  update-manifest:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tdlib-release-manifest
      cancel-in-progress: false
    outputs:
      manifest_commit: ${{ steps.commit_manifest.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/download-artifact@v7
        with:
          name: linux-built-library
          path: built-library/linux-x64/

      - uses: actions/download-artifact@v7
        with:
          name: macos-built-library
          path: built-library/macos-arm64/

      - uses: actions/download-artifact@v7
        with:
          name: windows-built-library
          path: built-library/windows-x64/

      - uses: actions/download-artifact@v7
        with:
          name: android-built-library-arm64
          path: built-library/android-arm64/

      - uses: actions/download-artifact@v7
        with:
          name: android-built-library-arm
          path: built-library/android-arm/

      - uses: actions/download-artifact@v7
        with:
          name: android-built-library-x64
          path: built-library/android-x64/

      - uses: actions/download-artifact@v7
        with:
          name: android-built-library-ia32
          path: built-library/android-ia32/

      - uses: actions/download-artifact@v7
        with:
          name: ios-built-library
          path: built-library/ios-arm64/

      - name: Create release-assets directory
        run: mkdir -p release-assets

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Generate manifest and release assets
        run: |
          TAG="${{ github.event.inputs.tag }}"
          dart run native_prebuilt manifest update \
            --config "$CONFIG" \
            --output "$MANIFEST_OUTPUT" \
            --built-library-dir built-library \
            --release-assets-dir release-assets \
            --tag "$TAG"

      - name: Commit generated manifest
        id: commit_manifest
        run: |
          git fetch origin main

          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::main moved while release artifacts were being built."
            echo "::error::built from: $GITHUB_SHA"
            echo "::error::current main: $REMOTE_SHA"
            echo "::error::Re-run the release from the current main branch."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$MANIFEST_OUTPUT"; then
            echo "No manifest changes to commit."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "$MANIFEST_OUTPUT"
          git commit -m \
            "chore: release ${{ github.event.inputs.tag }} prebuilts [skip ci]"

          COMMIT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main

          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - update-manifest
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-manifest.outputs.manifest_commit }}

      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets/

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ needs.update-manifest.outputs.manifest_commit }}
          fail_on_unmatched_files: true
          files: release-assets/*
