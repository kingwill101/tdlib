name: Prebuilt

on:
  push:
    branches:
      - main
    tags:
      - 'tdlib-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to stamp into the generated manifest
        required: false
        type: string

permissions:
  contents: read

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  CONFIG: native_prebuilt.yaml
  MANIFEST_OUTPUT: lib/src/hook/tdlib_prebuilts.g.dart

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Cache hook outputs and pub cache
        id: hooks-cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            .dart_tool/hooks_runner
          key: ${{ runner.os }}-linux-x64-${{ hashFiles('pubspec.lock', 'native_prebuilt.yaml', 'tool/schema/td_api.tl.commit', 'hook/build.dart', 'tool/preseed_hooks.dart') }}
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            gperf \
            libclang-dev \
            ninja-build \
            pkg-config
      - run: dart pub get --no-example
      - name: Prebuild native assets
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        run: dart run tool/preseed_hooks.dart --target-os linux --target-arch x64
      - run: dart test
      - name: Stage built library
        run: |
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-built-library
          path: built-library/
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Cache hook outputs and pub cache
        id: hooks-cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            .dart_tool/hooks_runner
          key: ${{ runner.os }}-macos-arm64-${{ hashFiles('pubspec.lock', 'native_prebuilt.yaml', 'tool/schema/td_api.tl.commit', 'hook/build.dart', 'tool/preseed_hooks.dart') }}
      - name: Install native toolchain
        run: brew install cmake coreutils gperf
      - run: dart pub get --no-example
      - name: Prebuild native assets
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        run: dart run tool/preseed_hooks.dart --target-os macos --target-arch arm64
      - run: dart test
      - name: Stage built library
        run: |
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-built-library
          path: built-library/
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Cache hook outputs and pub cache
        id: hooks-cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            .dart_tool/hooks_runner
          key: ${{ runner.os }}-windows-x64-${{ hashFiles('pubspec.lock', 'native_prebuilt.yaml', 'tool/schema/td_api.tl.commit', 'hook/build.dart', 'tool/preseed_hooks.dart') }}
      - name: Install native toolchain
        shell: pwsh
        run: |
          choco install gperf openssl.light -y --no-progress
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install zlib:x64-windows
          "ZLIB_ROOT=$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: dart pub get --no-example
      - name: Prebuild native assets
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        run: dart run tool/preseed_hooks.dart --target-os windows --target-arch x64
      - run: dart test
      - name: Stage built library
        run: |
          New-Item -ItemType Directory -Force -Path built-library | Out-Null
          Copy-Item -Recurse -Force ".dart_tool/lib/*" built-library
      - uses: actions/upload-artifact@v4
        with:
          name: windows-built-library
          path: built-library/
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Cache hook outputs and pub cache
        id: hooks-cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            .dart_tool/hooks_runner
          key: ${{ runner.os }}-android-arm64-${{ hashFiles('pubspec.lock', 'native_prebuilt.yaml', 'tool/schema/td_api.tl.commit', 'hook/build.dart', 'tool/preseed_hooks.dart') }}
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gperf
      - run: dart pub get --no-example
      - name: Prebuild native assets
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        run: dart run tool/preseed_hooks.dart --target-os android --target-arch arm64
      - run: dart test
      - name: Stage built library
        run: |
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/
      - uses: actions/upload-artifact@v4
        with:
          name: android-built-library
          path: built-library/
          if-no-files-found: error

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Cache hook outputs and pub cache
        id: hooks-cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            .dart_tool/hooks_runner
          key: ${{ runner.os }}-ios-arm64-${{ hashFiles('pubspec.lock', 'native_prebuilt.yaml', 'tool/schema/td_api.tl.commit', 'hook/build.dart', 'tool/preseed_hooks.dart') }}
      - name: Install native toolchain
        run: brew install cmake coreutils gperf
      - run: dart pub get --no-example
      - name: Prebuild native assets
        if: steps.hooks-cache.outputs.cache-hit != 'true'
        run: dart run tool/preseed_hooks.dart --target-os ios --target-arch arm64 --ios-sdk iphoneos
      - run: dart test
      - name: Stage built library
        run: |
          mkdir -p built-library
          cp -R .dart_tool/lib/. built-library/
      - uses: actions/upload-artifact@v4
        with:
          name: ios-built-library
          path: built-library/
          if-no-files-found: error

  update-manifest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          name: linux-built-library
          path: downloaded/linux/
      - uses: actions/download-artifact@v4
        with:
          name: macos-built-library
          path: downloaded/macos/
      - uses: actions/download-artifact@v4
        with:
          name: windows-built-library
          path: downloaded/windows/
      - uses: actions/download-artifact@v4
        with:
          name: android-built-library
          path: downloaded/android/
      - uses: actions/download-artifact@v4
        with:
          name: ios-built-library
          path: downloaded/ios/
      - name: Merge built libraries
        run: |
          rm -rf built-library release-assets
          mkdir -p built-library release-assets
          cp -R downloaded/linux/. built-library/
          cp -R downloaded/macos/. built-library/
          cp -R downloaded/windows/. built-library/
          cp -R downloaded/android/. built-library/
          cp -R downloaded/ios/. built-library/
      - run: dart pub get --no-example
      - name: Generate manifest and release assets
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          dart run native_prebuilt manifest update \
            --config "$CONFIG" \
            --output "$MANIFEST_OUTPUT" \
            --built-library-dir built-library \
            --release-assets-dir release-assets \
            --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs:
      - update-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: release-assets/*
