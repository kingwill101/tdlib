name: Native Prebuilt Build
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact-name:
        required: true
        type: string
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: tdlib-v1
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.dart_tool/tdlib-cmake-cache/windows-x64/vcpkg_installed
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1

      - name: Restore Dart package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: >-
            dart-pub-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native toolchain (Linux)
        if: inputs.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            gperf \
            libclang-dev \
            ninja-build \
            pkg-config

      - name: Resolve Android NDK
        if: startsWith(inputs.target, 'android-')
        shell: bash
        run: |
          set -euo pipefail

          NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"

          if [ -z "$NDK_HOME" ]; then
            if [ -n "$ANDROID_SDK_ROOT" ]; then
              NDK_HOME="$(
                find "$ANDROID_SDK_ROOT/ndk" \
                  -mindepth 1 \
                  -maxdepth 1 \
                  -type d \
                | sort -V \
                | tail -1
              )"
            fi
          fi

          if [ -z "$NDK_HOME" ]; then
            echo "Error: ANDROID_NDK_HOME is not set and no NDK found" >&2
            exit 1
          fi

          if [ ! -f "$NDK_HOME/build/cmake/android.toolchain.cmake" ]; then
            echo "Error: android.toolchain.cmake not found in $NDK_HOME" >&2
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using Android NDK: $NDK_HOME"

      - name: Install native tools (macOS)
        if: inputs.runner == 'macos-15'
        run: brew install gperf ninja

      - name: Configure MSVC command-line environment
        if: inputs.runner == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install native tools (Windows)
        if: inputs.runner == 'windows-latest'
        shell: pwsh
        run: choco install gperf -y

      - name: Set up vcpkg and install dependencies
        if: inputs.runner == 'windows-latest'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: b2cb0da531c2f1f740045bfe7c4dac59f0b2b69c
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true

      - name: Configure C/C++ compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Verify native build tools (Linux/macOS)
        if: inputs.runner != 'windows-latest'
        run: |
          cmake --version
          ninja --version
          gperf --version
          "${SCCACHE_PATH}" --version

      - name: Verify native build tools and dependencies (Windows)
        if: inputs.runner == 'windows-latest'
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          gperf --version
          cl
          sccache --version

          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $toolchainFile = Join-Path `
            $env:VCPKG_ROOT `
            "scripts/buildsystems/vcpkg.cmake"

          $zlibHeader = Join-Path `
            $env:VCPKG_INSTALLED_DIR `
            "x64-windows/include/zlib.h"

          $opensslHeader = Join-Path `
            $env:VCPKG_INSTALLED_DIR `
            "x64-windows/include/openssl/ssl.h"

          if (-not (Test-Path $vcpkgExe)) {
            throw "vcpkg.exe was not found: $vcpkgExe"
          }

          if (-not (Test-Path $toolchainFile)) {
            throw "vcpkg toolchain was not found: $toolchainFile"
          }

          if (-not (Test-Path $zlibHeader)) {
            throw "zlib was not installed: $zlibHeader"
          }

          if (-not (Test-Path $opensslHeader)) {
            throw "OpenSSL was not installed: $opensslHeader"
          }

          & $vcpkgExe version

          Write-Host "VCPKG_ROOT = $env:VCPKG_ROOT"
          Write-Host "VCPKG_INSTALLED_DIR = $env:VCPKG_INSTALLED_DIR"

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Build native artifacts
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: dart run native_prebuilt build --target "$TARGET" --output built-library --from-source

      - name: Verify Android binary architecture
        if: startsWith(inputs.target, 'android-')
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          LIB="built-library/$TARGET/libtdjson.so"

          if [ ! -f "$LIB" ]; then
            echo "Error: Built library not found: $LIB" >&2
            exit 1
          fi

          echo "=== Verifying architecture for $TARGET ==="
          file "$LIB"

          # Use readelf to check the ELF machine type
          if ! command -v readelf &>/dev/null; then
            echo "readelf not found, skipping verification"
            exit 0
          fi

          MACHINE="$(readelf -h "$LIB" 2>/dev/null | awk -F: '/Machine:/ {
            gsub(/^[ \t]+/, "", $2)
            print $2
          }')"

          echo "Detected machine: $MACHINE"

          case "$TARGET" in
            android-arm64)
              if ! echo "$MACHINE" | grep -qi 'AArch64'; then
                echo "ERROR: Expected AArch64 for android-arm64, got: $MACHINE" >&2
                exit 1
              fi
              ;;
            android-arm)
              if ! echo "$MACHINE" | grep -qi 'ARM'; then
                echo "ERROR: Expected ARM for android-arm, got: $MACHINE" >&2
                exit 1
              fi
              ;;
            android-x64)
              if ! echo "$MACHINE" | grep -qi 'X86-64'; then
                echo "ERROR: Expected X86-64 for android-x64, got: $MACHINE" >&2
                exit 1
              fi
              ;;
            android-ia32)
              if ! echo "$MACHINE" | grep -Eqi 'Intel 80386|80386'; then
                echo "ERROR: Expected IA-32 for android-ia32, got: $MACHINE" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown Android target: $TARGET" >&2
              exit 1
              ;;
          esac

          echo "Architecture verification passed for $TARGET"

      - name: Show compiler cache statistics (Windows)
        if: always() && inputs.runner == 'windows-latest'
        shell: pwsh
        run: sccache --show-stats

      - name: Show compiler cache statistics (Linux/macOS)
        if: always() && inputs.runner != 'windows-latest'
        run: "${SCCACHE_PATH} --show-stats"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.artifact-name }}
          path: built-library/${{ inputs.target }}/
          if-no-files-found: error
